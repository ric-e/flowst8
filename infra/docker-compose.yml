services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: flowst8-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowst8}
      POSTGRES_USER: ${POSTGRES_USER:-flowst8}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowst8}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowst8} -d ${POSTGRES_DB:-flowst8}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowst8

  redis:
    image: redis:7-alpine
    container_name: flowst8-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowst8

networks:
  flowst8:
    name: flowst8-network

volumes:
  postgres_data:
  redis_data: